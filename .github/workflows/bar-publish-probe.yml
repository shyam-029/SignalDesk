name: bar-publish-probe

# Work list item 25: measure WHEN Yahoo publishes the day's final daily bar,
# so the nightly can start right after it (item 26) instead of at a fixed
# 19:00 IST that GitHub then delays by hours.
#
# Every 15 minutes from 14:30 to 23:15 IST on weekdays (NSE closes 15:30 IST),
# fetch the last few daily bars for a few sentinel symbols exactly the way
# the nightly does (yfinance Ticker.history, same version pin) and print one
# PROBE line per symbol: whether today's bar exists and its values. Comparing
# consecutive runs shows when the bar first appears and when it stops
# changing. Read-only: no database, no secrets, public market data only.
#
# Upstox is not probed: that needs an UPSTOX_ANALYTICS_TOKEN Actions secret,
# which today exists only in Render.
#
# Temporary: disable once ~a week of weekdays is collected
#   gh workflow disable bar-publish-probe.yml
# Read the results:
#   gh run list --workflow bar-publish-probe.yml --limit 200 --json databaseId \
#     --jq '.[].databaseId' | xargs -n1 gh run view --log | grep ' PROBE '

on:
  schedule:
    - cron: "*/15 9-17 * * 1-5" # 09:00-17:45 UTC = 14:30-23:15 IST, Mon-Fri
  workflow_dispatch: {}

concurrency:
  group: bar-publish-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yfinance (same pin as backend/requirements.txt)
        run: pip install -q "yfinance>=1.6,<1.7"
      - name: Probe today's bar
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta

          import yfinance as yf

          IST = timezone(timedelta(hours=5, minutes=30))
          SENTINELS = ["RELIANCE.NS", "TCS.NS", "HDFCBANK.NS", "^NSEI"]
          now = datetime.now(timezone.utc)
          today_ist = now.astimezone(IST).date()

          lines = []
          for sym in SENTINELS:
              rec = {
                  "symbol": sym,
                  "observed_utc": now.strftime("%Y-%m-%dT%H:%M"),
                  "observed_ist": now.astimezone(IST).strftime("%H:%M"),
                  "ist_date": today_ist.isoformat(),
              }
              try:
                  hist = yf.Ticker(sym).history(period="5d")
                  rows = {idx.date(): row for idx, row in hist.iterrows()}
                  rec["last_bar"] = max(rows).isoformat() if rows else None
                  bar = rows.get(today_ist)
                  rec["today_present"] = bar is not None
                  if bar is not None:
                      for col in ("Open", "High", "Low", "Close"):
                          v = bar[col]
                          rec[col.lower()] = None if v != v else round(float(v), 4)
                      v = bar["Volume"]
                      rec["volume"] = None if v != v else int(v)
              except Exception as exc:  # record the failure, keep probing
                  rec["error"] = type(exc).__name__
              line = "PROBE " + json.dumps(rec, sort_keys=True)
              print(line)
              lines.append(line)

          import os
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("### Bar publish probe\n```\n" + "\n".join(lines) + "\n```\n")
          PY
