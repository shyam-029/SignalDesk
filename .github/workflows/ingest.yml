name: ingest

# M1-T5: production nightly ingestion (Plan 21.2, 28). Runs in GitHub
# Actions (the in-process APScheduler registers no jobs in production since
# f43776c). Daily at 10:45 UTC = 16:15 IST, 45 minutes after NSE closes
# (owner decision 2026-11-12, was 13:30 UTC = 19:00 IST), so the day's data
# is on the site the same evening. Each run refetches 2 years of bars, so a
# close Yahoo revises after 16:15 is corrected the next day.
#
# Started by the Cloudflare Worker (frontend/worker/index.js, ensureNightly),
# not by a GitHub schedule: GitHub's cron started the 16:15 slot up to 8 h
# late. The Worker dispatches this workflow at 16:15 IST and again at
# 18:15 IST only if today's run failed or never started. There is no GitHub
# schedule as well, so the two can never run the nightly twice; if the
# Worker cannot dispatch (e.g. its GitHub token expired), watchdog.yml alerts
# after 30 h without a successful ingest. Idempotent upserts tolerate reruns. Measured runtime 1.5-2 h vs the 6 h job cap (Plan 22);
# timeout-minutes fails fast at 5.5 h with a clear signal instead of an
# opaque runner wall.
#
# After the ingest job succeeds, two more jobs publish what the site reads
# first: per-stock snapshots to R2 and the landing snapshot (see the notes
# above those jobs). Their failures alert but do not fail the run.
#
# Weekends and NSE trading holidays (work list item 30): the Worker still
# dispatches every day, and the first step ends the run as a success when
# the market was closed, so the 18:15 retry and the watchdog see a
# successful night and nothing is fetched. The holiday list is Upstox's
# public market-holidays API (no key); if it cannot be read, the night runs.
#
# Tiered passes (item 29): statements weekly (every third day in results
# season), company profiles weekly and the full alpha-history recompute
# weekly, each judged from its own last successful run (app/jobs.py).

on:
  # Dispatched by the Cloudflare Worker daily (see above) or by hand.
  workflow_dispatch:
    inputs:
      all_passes:
        description: "Run every pass tonight, including the weekly ones"
        type: boolean
        default: false
      run_on_closed_day:
        description: "Run even though the market is closed today"
        type: boolean
        default: false

concurrency:
  group: nightly-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      open: ${{ steps.market.outputs.open }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_ENV: production
      INGEST_ALL_PASSES: ${{ inputs.all_passes && '1' || '' }}
      # Upstox is a PRICE FALLBACK only (providers/fallback.py): asked for bars
      # only when Yahoo's answer for a symbol is an error, empty or stale.
      # Empty/missing secret = Yahoo only, as before. Token expires ~2027-08;
      # the watchdog alerts if Upstox starts rejecting it.
      UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Was the market open today? (weekends and NSE holidays skip the night)
        id: market
        working-directory: ${{ github.workspace }}
        env:
          FORCE: ${{ inputs.run_on_closed_day && 'true' || 'false' }}
        run: |
          today=$(TZ=Asia/Kolkata date +%F)
          dow=$(TZ=Asia/Kolkata date +%u)
          open=true; why="a trading day"
          if [ "$dow" -ge 6 ]; then
            open=false; why="a weekend"
          else
            body=$(curl -sS --max-time 20 --retry 3 --retry-all-errors \
              -H "Accept: application/json" \
              "https://api.upstox.com/v2/market/holidays/$today" || true)
            if [ -z "$body" ] || ! echo "$body" | jq -e '.status == "success"' >/dev/null 2>&1; then
              why="a trading day as far as we know (holiday list unavailable)"
            elif echo "$body" | jq -e 'any(.data[]?; .holiday_type == "TRADING_HOLIDAY" and any(.closed_exchanges[]?; . == "NSE"))' >/dev/null; then
              open=false
              why="an NSE holiday ($(echo "$body" | jq -r '[.data[]? | .description] | join(", ")'))"
            fi
          fi
          if [ "$open" = false ] && [ "$FORCE" = true ]; then
            open=true; why="$why, run anyway (run_on_closed_day)"
          fi
          echo "$today (IST) is $why: open=$open"
          echo "### $today (IST) is $why" >> "$GITHUB_STEP_SUMMARY"
          echo "open=$open" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.market.outputs.open == 'true'
      - uses: actions/setup-python@v5
        if: steps.market.outputs.open == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies (full requirements, FinBERT runs here)
        if: steps.market.outputs.open == 'true'
        run: pip install -r requirements.txt
      - name: Require schema at Alembic head (migrations are applied only by the migrate workflow)
        # Fails fast and loudly instead of running new code on an old schema.
        # Raw alembic output is never printed: a connection error can carry the
        # database host, and this repo's Actions logs are public.
        if: steps.market.outputs.open == 'true'
        run: |
          if ! out=$(alembic current 2>&1); then
            kind=$(echo "$out" | grep -Eo '[A-Za-z_.]*(Error|Exception)' | tail -1)
            echo "::error::SCHEMA CHECK FAILED: could not read the database's Alembic revision (${kind:-unknown error}). Details withheld from public logs. Run the 'migrate' workflow to test connectivity."
            exit 1
          fi
          # Compare revision hashes explicitly (they are not secret) instead of
          # looking for alembic's "(head)" marker, and print both so a mismatch
          # is diagnosable from the public log.
          current=$(echo "$out" | grep -Eo '^[0-9a-f]{12}' | head -1)
          head=$(alembic heads 2>/dev/null | grep -Eo '^[0-9a-f]{12}' | head -1)
          echo "Database revision: ${current:-none}; code head: ${head:-none}"
          if [ -n "$current" ] && [ "$current" = "$head" ]; then
            echo "Schema is at Alembic head."
          else
            echo "::error::SCHEMA BEHIND CODE: database is not at Alembic head. Dispatch the 'migrate' workflow (direction=upgrade, revision=head) and then re-run this workflow. Nothing was ingested."
            exit 1
          fi
      - name: Nightly ingestion (all passes; per-pass isolation D19)
        if: steps.market.outputs.open == 'true'
        run: python -m app.jobs ingest
      - name: Post-run smoke (/status/full via Render)
        if: always() && steps.market.outputs.open == 'true'
        env:
          OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
        run: |
          set -e
          body=$(curl -sS --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 \
            -H "Authorization: Bearer $OPS_API_KEY" \
            https://signaldesk-31gt.onrender.com/status/full)
          echo "STATUS_FULL: $body"
          if echo "$body" | grep -Eq '"status": ?"ok"'; then
            echo "SMOKE: /status/full ok"
          else
            echo "SMOKE: /status/full NOT ok (see body above)"
            exit 1
          fi

  # Item 8: a failed run opens (or updates) a GitHub issue; the next success
  # closes it. See ops/ci/alert.sh.
  alert:
    needs: ingest
    if: always()
    permissions:
      issues: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ops/ci
            .github/actions
      - uses: ./.github/actions/alert
        with:
          title: "Nightly ingest failing"
          outcome: ${{ needs.ingest.result }}

  # --- After a successful ingest: the two snapshots the site reads first ----
  # These were separate workflows (stock-snapshots.yml, landing-snapshot.yml)
  # that GitHub started after each ingest, until 2026-11-13. As jobs here they
  # need no extra trigger and show on the same run page.
  #
  # continue-on-error: a snapshot failure must not mark the NIGHTLY as
  # failed. The Cloudflare Worker re-dispatches this workflow at 18:15 IST
  # when today's run did not succeed, and watchdog.yml judges the nightly by
  # the run's result, so a failed snapshot would otherwise re-run the whole
  # 1.5 h ingest. Each snapshot job still opens its own alert issue, from the
  # status it records itself (with continue-on-error, `needs.<job>.result`
  # cannot be trusted to show the failure).
  #
  # To redo just one snapshot: open the run and use "Re-run this job" on it.
  # Both check out main so they use the newest code.

  # One JSON file per listed stock (backend/app/services/stock_snapshot.py),
  # uploaded to the private Cloudflare R2 cache bucket. The frontend Worker
  # serves them at /snapshot/stock/<SYMBOL>.json, so the stock page renders
  # at once even while the Render API sleeps. Free-tier budget for ~1,000
  # stocks a night: R2 ~25 MB of 10 GB and ~31k writes a month of 1M; Neon
  # ~112 KB read per stock (measured 2026-11-13). Read-only against the
  # database; the upload key can only touch the cache bucket.
  stock-snapshots:
    needs: ingest
    if: needs.ingest.outputs.open == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      status: ${{ steps.done.outputs.status }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-render.txt
      - name: Install dependencies (the API's own, no ML stack)
        run: pip install -r requirements-render.txt

      - name: Build one snapshot per stock
        run: |
          set -euo pipefail
          python -m app.services.stock_snapshot "$RUNNER_TEMP/snap"
          n=$(ls "$RUNNER_TEMP/snap/stock" | wc -l)
          size=$(du -sh "$RUNNER_TEMP/snap" | cut -f1)
          echo "files: $n, total: $size"
          echo "### Stock snapshots: $n files, $size" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to the R2 cache bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_CACHE_BUCKET: ${{ secrets.R2_CACHE_BUCKET }}
        run: |
          set -euo pipefail
          ACCT=$(printf '%s' "$R2_ACCOUNT_ID" | grep -oiE '[0-9a-f]{32}' | head -n1 || true)
          BUCKET=$(printf '%s' "$R2_CACHE_BUCKET" | tr -d '[:space:]' | sed -e 's#/*$##' -e 's#.*/##')
          echo "::add-mask::$ACCT"
          [ -n "$ACCT" ] || { echo "::error::R2_ACCOUNT_ID has no 32-character account id"; exit 1; }
          # The Worker reads the bucket named in frontend/wrangler.jsonc; an
          # upload anywhere else would never be served.
          WANT=$(grep -oE '"bucket_name": *"[^"]+"' ../frontend/wrangler.jsonc | sed -E 's/.*"([^"]+)"$/\1/')
          if [ "$BUCKET" != "$WANT" ]; then
            echo "::error::R2_CACHE_BUCKET does not match the bucket_name in frontend/wrangler.jsonc ($WANT)."
            exit 1
          fi
          # sync uploads every file (all change nightly) and --delete removes
          # snapshots of stocks that left the listed universe.
          aws s3 sync "$RUNNER_TEMP/snap/stock" "s3://$BUCKET/stock" \
            --endpoint-url "https://${ACCT}.r2.cloudflarestorage.com" \
            --delete --only-show-errors \
            --content-type application/json \
            --cache-control "public, max-age=300"
          echo "uploaded to R2"

      - name: Record this job's result for its alert
        id: done
        if: always()
        run: echo "status=${{ job.status }}" >> "$GITHUB_OUTPUT"

  stock-snapshots-alert:
    needs: stock-snapshots
    if: always() && needs.stock-snapshots.result != 'skipped'
    permissions:
      issues: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ops/ci
            .github/actions
      - uses: ./.github/actions/alert
        with:
          title: "Stock snapshots failing"
          outcome: ${{ needs.stock-snapshots.outputs.status || 'failure' }}

  # Work list item 13. The landing page's data in one call (GET
  # /api/v1/landing, backend/app/services/landing_snapshot.py), committed as
  # frontend/public/snapshot/landing.json. Cloudflare Workers Builds redeploys
  # main, so the landing page renders without waiting for Render. A push made
  # with GITHUB_TOKEN starts no other workflow (no CI run per snapshot
  # commit); Cloudflare's GitHub app still sees it and deploys. Nothing is
  # committed when only the timestamp changed.
  landing-snapshot:
    needs: ingest
    if: needs.ingest.outputs.open == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      status: ${{ steps.done.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch the landing snapshot
        run: |
          API=https://signaldesk-31gt.onrender.com
          # Wake the instance first (it sleeps outside IST daytime).
          curl -sS -o /dev/null -w "health %{http_code} in %{time_total}s\n" \
            --max-time 120 --retry 3 --retry-delay 15 --retry-all-errors "$API/health"
          curl -sS --fail --max-time 180 --retry 2 --retry-delay 20 --retry-all-errors \
            "$API/api/v1/landing" -o landing.raw.json
          # Refuse to publish anything malformed or nearly empty.
          jq -e '.version == 1 and (.generated_at | type == "string") and (.queries | length >= 4)' \
            landing.raw.json > /dev/null
          jq -r '.queries[].key | tostring' landing.raw.json
          mkdir -p frontend/public/snapshot
          jq -c . landing.raw.json > frontend/public/snapshot/landing.json
          ls -l frontend/public/snapshot/landing.json

      - name: Commit if the data changed
        run: |
          git add frontend/public/snapshot/landing.json
          # generated_at always changes; compare the data only.
          if git diff --cached --quiet -- frontend/public/snapshot/landing.json; then
            echo "No change."; exit 0
          fi
          if git show HEAD:frontend/public/snapshot/landing.json > old.json 2>/dev/null \
            && [ "$(jq -S '.queries' old.json)" = "$(jq -S '.queries' frontend/public/snapshot/landing.json)" ]; then
            echo "Only the timestamp changed; not committing."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(snapshot): landing data $(jq -r .generated_at frontend/public/snapshot/landing.json)"
          git push origin HEAD:main

      - name: Record this job's result for its alert
        id: done
        if: always()
        run: echo "status=${{ job.status }}" >> "$GITHUB_OUTPUT"

  landing-snapshot-alert:
    needs: landing-snapshot
    if: always() && needs.landing-snapshot.result != 'skipped'
    permissions:
      issues: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ops/ci
            .github/actions
      - uses: ./.github/actions/alert
        with:
          title: "Landing snapshot failing"
          outcome: ${{ needs.landing-snapshot.outputs.status || 'failure' }}
