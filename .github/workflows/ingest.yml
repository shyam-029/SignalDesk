name: ingest

# M1-T5: production nightly ingestion (Plan 21.2, 28). GitHub Actions is the
# ONLY scheduler (D79; the in-process APScheduler registers no jobs in
# production since f43776c). Nominal 13:30 UTC = 19:00 IST after market
# close; GitHub cron can drift minutes-to-~30 during peak, which idempotent
# upserts tolerate. Measured runtime 1.5-2 h vs the 6 h job cap (Plan 22);
# timeout-minutes fails fast at 5.5 h with a clear signal instead of an
# opaque runner wall.

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch: {}

concurrency:
  group: nightly-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_ENV: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies (full requirements: FinBERT runs here)
        run: pip install -r requirements.txt
      - name: Apply migrations (idempotent; Render release command also runs these)
        run: alembic upgrade head
      - name: Nightly ingestion (all passes; per-pass isolation D19)
        run: python -m app.jobs ingest
      - name: Post-run smoke (/status/full via Render)
        if: always()
        env:
          OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
        run: |
          set -e
          body=$(curl -sS --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 \
            -H "Authorization: Bearer $OPS_API_KEY" \
            https://signaldesk-31gt.onrender.com/status/full)
          echo "STATUS_FULL: $body"
          if echo "$body" | grep -Eq '"status": ?"ok"'; then
            echo "SMOKE: /status/full ok"
          else
            echo "SMOKE: /status/full NOT ok (see body above)"
            exit 1
          fi
