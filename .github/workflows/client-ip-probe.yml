name: client-ip-probe

# One-off measurement for work list item 15: how does Render forward the
# client IP? Calls the operator-only /debug/client-ip-shape endpoint twice
# (with and without a forged X-Forwarded-For) and prints its answers, which
# are header NAMES, counts and yes/no comparisons only. The runner's own
# public IP is sent as the "caller" reference so the endpoint can say which
# header carries the real caller; it is never printed.

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
      API: https://signaldesk-31gt.onrender.com
      SPOOF: 203.0.113.9 # TEST-NET-3: documentation range, never a real host
    steps:
      - name: Probe header shape
        run: |
          set -euo pipefail
          CALLER=$(curl -sS --max-time 20 https://api.ipify.org)
          echo "::add-mask::$CALLER"
          call() {
            curl -sS --max-time 90 --retry 2 --retry-delay 10 \
              -H "Authorization: Bearer $OPS_API_KEY" \
              -H "X-Probe-Spoof: $SPOOF" -H "X-Probe-Caller: $CALLER" "$@" \
              "$API/debug/client-ip-shape"
          }
          echo "== without a forged X-Forwarded-For"
          call | python3 -m json.tool
          echo "== with a forged X-Forwarded-For: $SPOOF"
          call -H "X-Forwarded-For: $SPOOF" | python3 -m json.tool
          echo "== with forged CF-Connecting-IP and True-Client-IP: $SPOOF"
          call -H "CF-Connecting-IP: $SPOOF" -H "True-Client-IP: $SPOOF" -H "X-Real-IP: $SPOOF" | python3 -m json.tool
