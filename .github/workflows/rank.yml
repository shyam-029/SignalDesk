name: rank

# M1-T2: top-1000 universe ranking (E1-E12 eligibility, mcap rank, audit).
# M1-T5 wires the monthly schedule (workflow_dispatch retained for manual
# re-runs). 04:00 UTC on the 1st = 09:30 IST: about 9.5 h away from the
# 13:30 UTC nightly ingestion (no overlap; rank runs ~9.5 min anyway), and
# the same evening's nightly picks up the refreshed universe. Targets the
# PRODUCTION database via the DATABASE_URL Actions secret — no scratch
# Postgres service container.

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch: {}

concurrency:
  group: rank-universe
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_ENV: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Credential fingerprint (safe fields only, never the secret)
        run: |
          python - <<'EOF'
          import os

          from sqlalchemy.engine import make_url

          u = make_url(os.environ["DATABASE_URL"])
          pw = u.password or ""
          print("driver:", u.drivername)
          print("user:", u.username)
          print("host:", u.host)
          print("port:", u.port)
          print("database:", u.database)
          print("ssl_param:", "ssl" in u.query or "sslmode" in u.query)
          print("password_length:", len(pw))
          print("password_alnum_underscore:", pw.replace("_", "").isalnum())
          print("password_npg_prefix:", pw.startswith("npg_"))
          print("password_has_quotes:", pw[:1] in "\"'" or pw[-1:] in "\"'")
          print("password_has_edge_whitespace:", pw != pw.strip())
          EOF
      - name: Connectivity matrix (direct vs pooler host, read-only SELECT 1)
        run: |
          python - <<'EOF'
          import asyncio
          import os

          import asyncpg
          from sqlalchemy.engine import make_url

          async def probe(tag: str, host: str, user, port, database, password) -> None:
              try:
                  conn = await asyncpg.connect(
                      host=host, port=port or 5432, user=user,
                      password=password, database=database, ssl="require", timeout=15,
                  )
                  val = await conn.fetchval("SELECT 1")
                  await conn.close()
                  print(f"{tag}: OK (SELECT 1 -> {val})")
              except Exception as e:  # noqa: BLE001 - diagnostic prints, never raises
                  print(f"{tag}: FAIL {type(e).__name__}: {str(e)[:160]}")

          async def main() -> None:
              u = make_url(os.environ["DATABASE_URL"])
              host = u.host or ""
              await probe("direct", host.replace("-pooler", ""),
                          u.username, u.port, u.database, u.password)
              await probe("pooler", host,
                          u.username, u.port, u.database, u.password)

          asyncio.run(main())
          EOF
      - name: Render /status/full probe (is the API's own DB credential healthy?)
        env:
          OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
        run: |
          curl -sS --max-time 120 --retry 3 --retry-delay 10 \
            -H "Authorization: Bearer $OPS_API_KEY" \
            https://signaldesk-31gt.onrender.com/status/full
      - name: Apply migrations
        run: alembic upgrade head
      - name: Rank top-1000 universe (production)
        run: python -m app.jobs rank
