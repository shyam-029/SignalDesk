name: rank

# M1-T2: top-1000 universe ranking (E1-E12 eligibility, mcap rank, audit).
# M1-T5 wires the monthly schedule (workflow_dispatch retained for manual
# re-runs). 04:00 UTC on the 1st = 09:30 IST: about 9.5 h away from the
# 13:30 UTC nightly ingestion (no overlap; rank runs ~9.5 min anyway), and
# the same evening's nightly picks up the refreshed universe. Targets the
# PRODUCTION database via the DATABASE_URL Actions secret — no scratch
# Postgres service container.

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch: {}

concurrency:
  group: rank-universe
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    # Measured ~9.5 min from a residential IP, but GitHub runners share
    # egress IPs and Yahoo throttles them hard (429 + 3-attempt backoff per
    # symbol) — observed ~40 percent through the candidate alphabet at 26
    # min, projecting ~60-75 min total. 90 min leaves 3x headroom while
    # staying far under the 6 h job cap and clear of the 13:30 UTC nightly.
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_ENV: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Credential fingerprint (safe fields only, never the secret)
        continue-on-error: true
        run: |
          python - <<'EOF'
          import os

          raw = os.environ["DATABASE_URL"]

          def b(x: bool) -> str:
              return str(x).lower()

          # Shape diagnostics on the RAW value (booleans/counts only; no
          # substrings are ever printed).
          print("raw_length:", len(raw))
          print("raw_starts_with_quote:", raw[:1] in "\"'")
          print("raw_ends_with_quote:", raw[-1:] in "\"'")
          print("raw_has_whitespace:", any(c.isspace() for c in raw))
          print("raw_has_angle_bracket:", "<" in raw or ">" in raw)
          print("raw_has_bracket:", "[" in raw or "]" in raw)
          print("raw_at_count:", raw.count("@"))
          print("raw_colon_count:", raw.count(":"))
          print("raw_has_scheme_separator:", "://" in raw)
          print("raw_scheme_is_pg:", raw.split("://", 1)[0] in
                ("postgresql", "postgres", "postgresql+asyncpg"))

          try:
              from sqlalchemy.engine import make_url

              u = make_url(raw)
          except Exception as e:  # noqa: BLE001 - diagnostic prints, never raises
              print("make_url: FAILED", type(e).__name__)
              raise SystemExit(0)
          pw = u.password or ""
          print("driver:", u.drivername)
          print("user:", u.username)
          print("host:", u.host)
          print("port:", u.port)
          print("database:", u.database)
          print("ssl_param:", "ssl" in u.query or "sslmode" in u.query)
          print("password_length:", len(pw))
          print("password_alnum_underscore:", pw.replace("_", "").isalnum())
          print("password_npg_prefix:", pw.startswith("npg_"))
          print("password_has_quotes:", pw[:1] in "\"'" or pw[-1:] in "\"'")
          print("password_has_edge_whitespace:", pw != pw.strip())
          EOF
      - name: Connectivity matrix (direct vs pooler host, read-only SELECT 1)
        continue-on-error: true
        run: |
          python - <<'EOF'
          import asyncio
          import os

          import asyncpg
          from sqlalchemy.engine import make_url

          async def probe(tag: str, host: str, user, port, database, password) -> None:
              try:
                  conn = await asyncpg.connect(
                      host=host, port=port or 5432, user=user,
                      password=password, database=database, ssl="require", timeout=15,
                  )
                  val = await conn.fetchval("SELECT 1")
                  await conn.close()
                  print(f"{tag}: OK (SELECT 1 -> {val})")
              except Exception as e:  # noqa: BLE001 - diagnostic prints, never raises
                  print(f"{tag}: FAIL {type(e).__name__}: {str(e)[:160]}")

          async def main() -> None:
              u = make_url(os.environ["DATABASE_URL"])
              host = u.host or ""
              await probe("direct", host.replace("-pooler", ""),
                          u.username, u.port, u.database, u.password)
              await probe("pooler", host,
                          u.username, u.port, u.database, u.password)

          asyncio.run(main())
          EOF
      - name: Render /status/full probe (is the API's own DB credential healthy?)
        continue-on-error: true
        env:
          OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
        run: |
          curl -sS --max-time 120 --retry 3 --retry-delay 10 \
            -H "Authorization: Bearer $OPS_API_KEY" \
            https://signaldesk-31gt.onrender.com/status/full
      - name: Apply migrations
        run: alembic upgrade head
      - name: Rank top-1000 universe (production)
        run: python -m app.jobs rank
      - name: Last job_runs rows (surfaces stored error summaries)
        continue-on-error: true
        run: |
          python - <<'EOF'
          import asyncio
          import os

          import asyncpg
          from sqlalchemy.engine import make_url

          async def main() -> None:
              u = make_url(os.environ["DATABASE_URL"])
              conn = await asyncpg.connect(
                  host=u.host, port=u.port or 5432, user=u.username,
                  password=u.password, database=u.database,
                  ssl="require", timeout=15,
              )
              rows = await conn.fetch(
                  "SELECT job_name, status, items_processed, items_failed, "
                  "error_summary, started_at FROM job_runs "
                  "ORDER BY started_at DESC LIMIT 5"
              )
              for r in rows:
                  print(dict(r))
              await conn.close()

          asyncio.run(main())
          EOF
