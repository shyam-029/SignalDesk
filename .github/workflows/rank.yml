name: rank

# M1-T2: top-1000 universe ranking (E1-E12 eligibility, mcap rank, audit).
# M1-T5 wires the monthly schedule (workflow_dispatch retained for manual
# re-runs). 04:00 UTC on the 1st = 09:30 IST: about 9.5 h away from the
# 13:30 UTC nightly ingestion (no overlap; rank runs ~9.5 min anyway), and
# the same evening's nightly picks up the refreshed universe. Targets the
# PRODUCTION database via the DATABASE_URL Actions secret — no scratch
# Postgres service container.

on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch: {}

concurrency:
  group: rank-universe
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    # Measured ~9.5 min from a residential IP, but GitHub runners share
    # egress IPs and Yahoo throttles them hard (429 + 3-attempt backoff per
    # symbol) — observed ~40 percent through the candidate alphabet at 26
    # min, projecting ~60-75 min total. 90 min leaves 3x headroom while
    # staying far under the 6 h job cap and clear of the 13:30 UTC nightly.
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_ENV: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Render /status/full probe (is the API's own DB credential healthy?)
        continue-on-error: true
        env:
          OPS_API_KEY: ${{ secrets.OPS_API_KEY }}
        run: |
          curl -sS --max-time 120 --retry 3 --retry-delay 10 \
            -H "Authorization: Bearer $OPS_API_KEY" \
            https://signaldesk-31gt.onrender.com/status/full
      - name: Require schema at Alembic head (migrations are applied only by the migrate workflow)
        # Fails fast and loudly instead of running new code on an old schema.
        # Raw alembic output is never printed: a connection error can carry the
        # database host, and this repo's Actions logs are public.
        run: |
          if ! out=$(alembic current 2>&1); then
            kind=$(echo "$out" | grep -Eo '[A-Za-z_.]*(Error|Exception)' | tail -1)
            echo "::error::SCHEMA CHECK FAILED: could not read the database's Alembic revision (${kind:-unknown error}). Details withheld from public logs. Run the 'migrate' workflow to test connectivity."
            exit 1
          fi
          # Compare revision hashes explicitly (they are not secret) instead of
          # looking for alembic's "(head)" marker, and print both so a mismatch
          # is diagnosable from the public log.
          current=$(echo "$out" | grep -Eo '^[0-9a-f]{12}' | head -1)
          head=$(alembic heads 2>/dev/null | grep -Eo '^[0-9a-f]{12}' | head -1)
          echo "Database revision: ${current:-none}; code head: ${head:-none}"
          if [ -n "$current" ] && [ "$current" = "$head" ]; then
            echo "Schema is at Alembic head."
          else
            echo "::error::SCHEMA BEHIND CODE: database is not at Alembic head. Dispatch the 'migrate' workflow (direction=upgrade, revision=head) and then re-run this workflow. Nothing was run."
            exit 1
          fi
      - name: Rank top-1000 universe (production)
        run: python -m app.jobs rank
      - name: Last job_runs rows (surfaces stored error summaries)
        continue-on-error: true
        run: |
          python - <<'EOF'
          import asyncio
          import os

          import asyncpg
          from sqlalchemy.engine import make_url

          async def main() -> None:
              u = make_url(os.environ["DATABASE_URL"])
              conn = await asyncpg.connect(
                  host=u.host, port=u.port or 5432, user=u.username,
                  password=u.password, database=u.database,
                  ssl="require", timeout=15,
              )
              rows = await conn.fetch(
                  "SELECT job_name, status, items_processed, items_failed, "
                  "error_summary, started_at FROM job_runs "
                  "ORDER BY started_at DESC LIMIT 5"
              )
              for r in rows:
                  print(dict(r))
              await conn.close()

          asyncio.run(main())
          EOF

  # Item 8: a failed run opens (or updates) a GitHub issue; the next success
  # closes it. See ops/ci/alert.sh.
  alert:
    needs: rank
    if: always()
    permissions:
      issues: write
      contents: read
    uses: ./.github/workflows/run-alert.yml
    with:
      title: "Monthly ranking failing"
      outcome: ${{ needs.rank.result }}
