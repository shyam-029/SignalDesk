# Operational DB probe (Plan 28 monitoring): read-only database size and
# table counts against the production Neon database. No secrets printed.
#
# M2-T1: weekly schedule added. Safety rationale: this workflow contains
# ONLY read-only psql metadata queries (pg_database_size, pg_stat_user_tables)
# and shares nothing with the ingestion path — ingest.yml, its passes, and
# its concurrency group are untouched, so the M1-T7 nightly-cron reliability
# baseline cannot be affected. The Monday 06:00 UTC slot also avoids the
# nightly (13:30 UTC) and the monthly rank (04:00 UTC on the 1st). The
# fresh numbers feed BASELINE_BYTES in app/services/storage.py (the canary)
# and the retention gate decision.
name: db-probe
on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC (read-only; T7-safe)
  workflow_dispatch:

concurrency:
  group: db-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Install postgresql-client 17
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-17

      - name: Database size and largest tables (read-only)
        run: |
          PGURL=$(echo "$DATABASE_URL" | sed -e 's/^postgresql+asyncpg:/postgresql:/' -e 's/ssl=require/sslmode=require/')
          PSQL=/usr/lib/postgresql/17/bin/psql
          $PSQL "$PGURL" -v ON_ERROR_STOP=1 -c "SELECT pg_size_pretty(pg_database_size(current_database())) AS db_size, current_database() AS db;"
          $PSQL "$PGURL" -v ON_ERROR_STOP=1 -c "
            SELECT relname AS table,
                   pg_size_pretty(pg_total_relation_size(relid)) AS total_size,
                   n_live_tup AS approx_rows
            FROM pg_stat_user_tables
            ORDER BY pg_total_relation_size(relid) DESC
            LIMIT 8;"
