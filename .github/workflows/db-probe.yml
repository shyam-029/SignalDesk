# Operational DB probe (Plan 28 monitoring): read-only database size and
# table counts against the production Neon database. No secrets printed.
#
# M2-T1: weekly schedule added. Safety rationale: this workflow contains
# ONLY read-only psql metadata queries (pg_database_size, pg_stat_user_tables)
# and shares nothing with the ingestion path — ingest.yml, its passes, and
# its concurrency group are untouched, so the M1-T7 nightly-cron reliability
# baseline cannot be affected. The Monday 06:00 UTC slot also avoids the
# nightly (13:30 UTC) and the monthly rank (04:00 UTC on the 1st). The
# fresh numbers feed BASELINE_BYTES in app/services/storage.py (the canary)
# and the retention gate decision.
name: db-probe
on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC (read-only; T7-safe)
  workflow_dispatch:
    inputs:
      forensics:
        description: "Also run the full storage forensics (ops/sql/storage_forensics.sql, read-only)"
        type: boolean
        default: false

concurrency:
  group: db-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client 17
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-17

      - name: Database size and largest tables (read-only)
        run: |
          PGURL=$(echo "$DATABASE_URL" | sed -e 's/^postgresql+asyncpg:/postgresql:/' -e 's/ssl=require/sslmode=require/')
          PSQL=/usr/lib/postgresql/17/bin/psql
          $PSQL "$PGURL" -v ON_ERROR_STOP=1 -c "SELECT pg_size_pretty(pg_database_size(current_database())) AS db_size, current_database() AS db;"
          $PSQL "$PGURL" -v ON_ERROR_STOP=1 -c "
            SELECT relname AS table,
                   pg_size_pretty(pg_total_relation_size(relid)) AS total_size,
                   n_live_tup AS approx_rows
            FROM pg_stat_user_tables
            ORDER BY pg_total_relation_size(relid) DESC
            LIMIT 8;"

      # Phase 1 of the 2026-11 remediation. Manual dispatch only, so the weekly
      # schedule above stays exactly as it was. Both scripts run inside
      # BEGIN READ ONLY (Postgres rejects any write) and print sizes, counts and
      # dates only. They are also executed against the CI test database by
      # backend/tests/test_storage_forensics_sql.py.
      - name: Ingestion health, last 30 days - read-only
        if: github.event_name == 'workflow_dispatch' && inputs.forensics
        run: |
          PGURL=$(echo "$DATABASE_URL" | sed -e 's/^postgresql+asyncpg:/postgresql:/' -e 's/ssl=require/sslmode=require/')
          /usr/lib/postgresql/17/bin/psql "$PGURL" -v ON_ERROR_STOP=1 -f ops/sql/job_health.sql

      - name: Storage forensics (dispatch-only, read-only transaction)
        # Phase 1 remediation (2026-11-10). Never on the weekly schedule:
        # only when dispatched with forensics=true. The script wraps itself in
        # BEGIN READ ONLY, so Postgres rejects any write it might contain; it is
        # also executed against the CI test database on every push.
        if: github.event_name == 'workflow_dispatch' && inputs.forensics
        run: |
          PGURL=$(echo "$DATABASE_URL" | sed -e 's/^postgresql+asyncpg:/postgresql:/' -e 's/ssl=require/sslmode=require/')
          /usr/lib/postgresql/17/bin/psql "$PGURL" -X -v ON_ERROR_STOP=1 -P pager=off \
            -f ops/sql/storage_forensics.sql
