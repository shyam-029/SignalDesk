name: backup

# M1-T5 weekly backup (Plan 28): pg_dump of the Neon database uploaded as a
# workflow artifact (30-day retention) and copied to a private Cloudflare R2
# bucket (newest 12 kept), plus the Plan 22 storage canary.
#
# Two INDEPENDENT jobs (Phase 0 remediation, 2026-11-10):
#   backup          dump -> verify the archive -> upload. Its result answers
#                   one question only: "do we have a restorable backup?"
#   storage-canary  logs pg_database_size and fails at/above 450 MB.
# Before this split the canary ran BETWEEN the dump and the upload in a single
# job, so once the database crossed 450 MB every dump was discarded and no
# backup was stored (observed 2026-11-10: a 55 MB dump thrown away). The
# alarm must never be able to suppress the backup it sits next to.
#
# The postgres:17 image pins pg_dump >= the server major (ubuntu's default
# client is older). The DATABASE_URL secret is the asyncpg form and is
# rewritten to a libpq URL for the pg tools. Weekly egress is ~50-100 MB
# compressed, well inside Neon's 5 GB/month. Both jobs are read-only against
# the database.

on:
  schedule:
    - cron: "0 2 * * 0" # Sundays 02:00 UTC; far from ingest (13:30) and rank (04:00)
  workflow_dispatch: {}

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: pg_dump to a custom-format file
        run: |
          set -euo pipefail
          PGURL=$(echo "$DATABASE_URL" | sed -e 's/^postgresql+asyncpg:/postgresql:/' -e 's/ssl=require/sslmode=require/')
          DUMP="signaldesk-$(date -u +%Y%m%d-%H%M).dump"
          docker run --rm -v "$PWD:/out" -e PGURL="$PGURL" -e DUMP="$DUMP" postgres:17 \
            sh -c 'pg_dump "$PGURL" -Fc -f "/out/$DUMP"'
          ls -lh "$DUMP"
          echo "DUMP=$DUMP" >> "$GITHUB_ENV"

      - name: Verify the archive is readable and complete
        # pg_restore --list reads the archive's table of contents without a
        # database connection: a truncated or corrupt file fails here, and
        # every core table must have a TABLE DATA entry. Missing tables fail
        # the job rather than uploading a backup that cannot restore them.
        run: |
          set -euo pipefail
          test -s "$DUMP"
          docker run --rm -v "$PWD:/out" postgres:17 \
            pg_restore --list "/out/$DUMP" > toc.txt
          echo "TOC entries: $(grep -cv '^;' toc.txt)"
          missing=0
          for t in stocks daily_prices alpha_scores financials news_articles \
                   benchmark_prices mf_nav_history ranking_audit alembic_version; do
            if grep -Eq "TABLE DATA public ${t} " toc.txt; then
              echo "ok      $t"
            else
              echo "MISSING $t"; missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Backup archive is missing core table data; not uploading."
            exit 1
          fi
          {
            echo "### Backup"
            echo "- file: \`$DUMP\`"
            echo "- size: $(du -h "$DUMP" | cut -f1)"
            echo "- sha256: \`$(sha256sum "$DUMP" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dump artifact
        uses: actions/upload-artifact@v4
        with:
          name: signaldesk-db-dump
          path: ${{ env.DUMP }}
          if-no-files-found: error
          retention-days: 30

      - name: Copy the dump to Cloudflare R2 (private, off-GitHub)
        # Item 10: the repo is public and workflow artifacts expire after 30
        # days, so each verified dump is also kept in a private R2 bucket.
        # Weekly run, newest 12 kept (~3 months, well under 1 GB of the
        # 10 GB free tier). The key can only touch this one bucket. GitHub
        # masks the secret values in the log. The checksum settings are
        # Cloudflare's recommendation for the AWS CLI against R2. It runs
        # after the artifact upload so an R2 problem can never cost the
        # GitHub copy (observed 2026-11-12: a DNS failure skipped it).
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          KEEP: "12"
        run: |
          set -euo pipefail
          # Accept the secrets as pasted: the account id is the 32-hex part
          # (also when the whole S3 API URL was stored), the bucket is the
          # last path segment of a URL or the plain name.
          ACCT=$(printf '%s' "$R2_ACCOUNT_ID" | grep -oiE '[0-9a-f]{32}' | head -n1 || true)
          R2_BUCKET=$(printf '%s' "$R2_BUCKET" | tr -d '[:space:]' | sed -e 's#/*$##' -e 's#.*/##')
          if [ -z "$ACCT" ]; then
            echo "::error::R2_ACCOUNT_ID has no 32-character account id; paste the part of the S3 API URL before .r2.cloudflarestorage.com"; exit 1
          fi
          if [ -z "$R2_BUCKET" ]; then
            echo "::error::R2_BUCKET is empty"; exit 1
          fi
          # GitHub masks a secret only as stored; mask the extracted parts too.
          echo "::add-mask::$ACCT"
          echo "::add-mask::$R2_BUCKET"
          echo "secrets look well-formed (account id 32 hex, bucket name ${#R2_BUCKET} chars)"
          EP="https://${ACCT}.r2.cloudflarestorage.com"
          aws s3 cp "$DUMP" "s3://${R2_BUCKET}/db/$DUMP" --endpoint-url "$EP" --only-show-errors
          # Read it back: the stored size must match the local file.
          REMOTE=$(aws s3api head-object --bucket "$R2_BUCKET" --key "db/$DUMP" \
            --endpoint-url "$EP" --query ContentLength --output text)
          LOCAL=$(stat -c %s "$DUMP")
          if [ "$REMOTE" != "$LOCAL" ]; then
            echo "::error::R2 copy size $REMOTE != local $LOCAL"; exit 1
          fi
          echo "R2 copy verified ($LOCAL bytes)"
          # Retention: names sort by date, so delete all but the newest $KEEP.
          aws s3api list-objects-v2 --bucket "$R2_BUCKET" --prefix db/ \
            --endpoint-url "$EP" --query 'Contents[].Key' --output text \
            | tr '\t' '\n' | grep -E '^db/signaldesk-[0-9]{8}-[0-9]{4}\.dump$' \
            | sort | head -n -"$KEEP" | while read -r old; do
                aws s3 rm "s3://${R2_BUCKET}/$old" --endpoint-url "$EP" --only-show-errors
                echo "pruned $old"
              done
          echo "- R2: copied and verified, newest $KEEP kept" >> "$GITHUB_STEP_SUMMARY"


  storage-canary:
    # Runs after the backup job whatever its outcome (sequenced only to avoid
    # two simultaneous connections to Neon), and can never affect it.
    needs: backup
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Storage canary (advisory alarm at 800 MB of the 1024 MB Neon limit)
        run: |
          set -euo pipefail
          PGURL=$(echo "$DATABASE_URL" | sed -e 's/^postgresql+asyncpg:/postgresql:/' -e 's/ssl=require/sslmode=require/')
          BYTES=$(docker run --rm -e PGURL="$PGURL" postgres:17 \
            sh -c 'psql "$PGURL" -t -A -c "SELECT pg_database_size(current_database())"')
          echo "Database size: $BYTES bytes"
          echo "### Storage canary: pg_database_size = $BYTES bytes" >> "$GITHUB_STEP_SUMMARY"
          # Keep in sync with settings.storage_cut_threshold_mb (800).
          if [ "$BYTES" -ge 800000000 ]; then
            # pg_database_size includes dead-tuple bloat, so crossing the line
            # does not by itself mean live data grew. Measure before acting;
            # any data deletion (including prune-alpha) needs owner approval.
            echo "::error::STORAGE ALARM: at/above 800 MB (Neon enforces 1024 MB). Run db-probe forensics (dead tuples, index sizes) before acting. Do NOT run prune-alpha or delete data without owner approval."
            exit 1
          fi

  # Item 8: a failed run opens (or updates) a GitHub issue; the next success
  # closes it. See ops/ci/alert.sh.
  alert:
    needs: backup
    if: always()
    permissions:
      issues: write
      contents: read
    uses: ./.github/workflows/run-alert.yml
    with:
      title: "Weekly backup failing"
      outcome: ${{ needs.backup.result }}
